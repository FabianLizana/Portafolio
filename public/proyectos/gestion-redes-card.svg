<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 645" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Gestión de Redes — próximamente">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1038"/>
      <stop offset="100%" stop-color="#2d164a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0%" stop-color="#c5fa67" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c5fa67" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5fa67"/>
      <stop offset="100%" stop-color="#52f3de"/>
    </linearGradient>
    <style>
      @keyframes pulse { 0%,100% { opacity:0.55; } 50% { opacity:1; } }
      .node { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .n1 { animation-delay: 0s; }
      .n2 { animation-delay: .4s; }
      .n3 { animation-delay: .8s; }
      .n4 { animation-delay: 1.2s; }
      .n5 { animation-delay: 1.6s; }
      @media (prefers-reduced-motion: reduce) { .node { animation: none; opacity: 0.85; } }
    </style>
  </defs>

  <rect width="400" height="645" fill="url(#bg)"/>
  <rect width="400" height="645" fill="url(#glow)"/>

  <!-- Grafo de red social -->
  <g stroke="#c5fa67" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="200" y1="260" x2="110" y2="180"/>
    <line x1="200" y1="260" x2="290" y2="180"/>
    <line x1="200" y1="260" x2="120" y2="360"/>
    <line x1="200" y1="260" x2="280" y2="360"/>
    <line x1="110" y1="180" x2="70"  y2="110"/>
    <line x1="290" y1="180" x2="340" y2="110"/>
    <line x1="120" y1="360" x2="80"  y2="440"/>
    <line x1="280" y1="360" x2="320" y2="440"/>
    <line x1="110" y1="180" x2="290" y2="180" stroke-dasharray="4 4" stroke-opacity="0.25"/>
  </g>

  <!-- Nodos -->
  <g fill="url(#node)">
    <circle class="node n1" cx="110" cy="180" r="14"/>
    <circle class="node n2" cx="290" cy="180" r="14"/>
    <circle class="node n3" cx="120" cy="360" r="12"/>
    <circle class="node n4" cx="280" cy="360" r="12"/>
    <circle class="node n5" cx="200" cy="260" r="22"/>
    <circle cx="70"  cy="110" r="8" fill-opacity="0.7"/>
    <circle cx="340" cy="110" r="8" fill-opacity="0.7"/>
    <circle cx="80"  cy="440" r="8" fill-opacity="0.7"/>
    <circle cx="320" cy="440" r="8" fill-opacity="0.7"/>
  </g>

  <!-- Iconos sociales sutiles en nodos principales -->
  <g fill="#07100f" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    <text x="200" y="266">f</text>
    <text x="110" y="186" font-size="11">in</text>
    <text x="290" y="186" font-size="14">@</text>
  </g>

  <!-- Tag "Próximamente" -->
  <g transform="translate(200, 540)">
    <rect x="-72" y="-16" width="144" height="32" rx="16" fill="rgba(9,10,13,0.55)" stroke="rgba(197,250,103,0.35)" stroke-width="1"/>
    <text x="0" y="5" fill="#c5fa67" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" text-anchor="middle">PRÓXIMAMENTE</text>
  </g>
</svg>
